# PR마다 테스트를 자동으로 돌린다(TODOS ci-pipeline).
# 서버와 같은 런타임: Node.js 22, Python 3.12(Ubuntu 24.04 기본), PostgreSQL 16.
# 외부 API(Azure·Gemini)는 테스트에서 쓰지 않는다 — 키를 넣지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (jest · tsc)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test -- --ci

  backend-int:
    name: backend 통합 (빈 DB 마이그레이션 + int-spec)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:int -- --ci

  frontend:
    name: frontend (vitest · tsc)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test

  ai-service:
    name: ai-service (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  asr-eval:
    name: asr_eval (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/asr_eval/requirements-dev.txt
      - run: pip install -r scripts/asr_eval/requirements-dev.txt
      - run: python -m pytest scripts/asr_eval/ -q

  deploy-scripts:
    name: 배포 스크립트 (bash)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy/tests/deploy-scripts.test.sh
      - run: bash scripts/deploy/02-app-deploy.window.test.sh
